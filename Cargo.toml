[package]
name = "swe-grep"
version = "0.1.12"
edition = "2024"
rust-version = "1.96.0"
description = "AI-powered Agentic Code Search CLI"
readme = "README.md"
license = "MIT"

[[bin]]
name = "swe-grep"
path = "src/main.rs"

[[bench]]
name = "local_tools"
harness = false

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"
globset = "0.4"
ignore = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache"] }
self-replace = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2"
