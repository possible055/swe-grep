minimum_pre_commit_version: "4.5.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-added-large-files
        args: ["--maxkb=1500"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        stages: [pre-commit]
        files: '^(Cargo\.(toml|lock)|rust-toolchain\.toml|src/.*\.rs|tests/.*\.rs)$'
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --locked --all-targets --all-features -- -D warnings
        language: system
        stages: [pre-commit]
        files: '^(Cargo\.(toml|lock)|rust-toolchain\.toml|src/.*\.rs|tests/.*\.rs)$'
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test --locked
        language: system
        stages: [pre-commit]
        files: '^(Cargo\.(toml|lock)|rust-toolchain\.toml|src/.*\.rs|tests/.*\.rs)$'
        pass_filenames: false

      - id: cargo-audit
        name: cargo audit
        entry: cargo audit --deny warnings
        language: system
        stages: [pre-commit]
        pass_filenames: false
        files: ^Cargo\.(toml|lock)$

      - id: cargo-deny
        name: cargo deny
        entry: cargo deny check
        language: system
        stages: [pre-commit]
        pass_filenames: false
        files: ^(Cargo\.(toml|lock)|deny\.toml)$

      - id: cargo-vet
        name: cargo vet
        entry: cargo vet --locked
        language: system
        stages: [pre-commit]
        pass_filenames: false
        files: ^(Cargo\.(toml|lock)|supply-chain/.*)$
